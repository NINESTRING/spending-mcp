services:
  db:
    image: postgres:17
    container_name: spending-db
    environment:
      POSTGRES_PASSWORD: spending
      POSTGRES_DB: spending
    ports:
      # Loopback only: the development database is not reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - spending-db:/var/lib/postgresql/data

volumes:
  spending-db:
